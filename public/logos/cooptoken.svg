<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Cooptoken</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#0c1220"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#f5c84c"/>
    </linearGradient>
  </defs>
  <!-- outer disc -->
  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>
  <!-- coin rim -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#f5c84c" stroke-width="4"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#ring)" stroke-width="2.5" stroke-dasharray="100 14" stroke-linecap="round" transform="rotate(-40 100 100)"/>
  <!-- center mark: open-tailed C with spark -->
  <g fill="#f5c84c">
    <circle cx="100" cy="100" r="30" fill="#f5c84c" opacity="0.12"/>
    <path d="M 95 62 C 78 55 56 62 48 74 C 44 88 50 96 62 98 L 70 98 C 86 96 100 98 108 92 C 120 84 128 76 132 68 L 132 60" fill="none" stroke="#f5c84c" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- sparkle -->
  <circle cx="128" cy="138" r="7" fill="#fff" opacity="0.9"/>
</svg>